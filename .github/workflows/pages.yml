# Build a static export and deploy to GitHub Pages.
#
# After making the repo public:
# 1. Settings → Pages → Source: GitHub Actions
# 2. Push to main (or run this workflow manually from the Actions tab)
#
# Site URL:
#   https://devamir99.github.io/creative-development-doc/
#
# Note: GitHub Pages is static. The /api/search route is excluded from this
# build (no Node server). Docs, demos, and locale pages still ship.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      # Static export cannot ship Route Handlers (/api/*).
      - name: Exclude API routes for static export
        run: rm -rf src/app/api

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "1"
          # Full public URL including the repo basePath (for sitemap/canonical).
          NEXT_PUBLIC_SITE_URL: https://devamir99.github.io/creative-development-doc

      # Jekyll on Pages ignores folders starting with _ (breaks /_next assets).
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
