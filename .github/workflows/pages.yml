# Build a static export and deploy to GitHub Pages.
#
# After making the repo public:
# 1. Settings → Pages → Source: GitHub Actions
# 2. Push to main (or run this workflow manually from the Actions tab)
#
# Site URL:
#   https://devamir99.github.io/creative-development-doc/
#
# Note: GitHub Pages is static. The /api/search route is excluded from this
# build (no Node server). Docs, demos, and locale pages still ship.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do NOT set registry-url — setup-node then injects NODE_AUTH_TOKEN + a
      # temp .npmrc that breaks public registry.npmjs.org installs.
      # Do NOT enable npm cache until install is stable (corrupt cache →
      # "Exit handler never called!").
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: |
          npm --version
          npm install -g npm@10.9.2
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
        env:
          # Force public registry even if a local/user .npmrc sneaks in.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Generate MDX source
        run: npx fumadocs-mdx

      - name: Dump npm log on failure
        if: failure()
        run: |
          ls -la "$HOME/.npm/_logs" || true
          tail -n 200 "$HOME/.npm/_logs/"*-debug-0.log || true

      # Static export cannot ship Route Handlers (/api/*).
      - name: Exclude API routes for static export
        run: rm -rf src/app/api

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "1"
          # Full public URL including the repo basePath (for sitemap/canonical).
          NEXT_PUBLIC_SITE_URL: https://devamir99.github.io/creative-development-doc

      # Jekyll on Pages ignores folders starting with _ (breaks /_next assets).
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Root layout lives under [lang]/ — no app/page.tsx. On static Pages
      # (no proxy middleware) write a tiny redirect for the site root.
      - name: Root redirect to /en/
        run: |
          cat > out/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0;url=./en/" />
            <link rel="canonical" href="./en/" />
            <title>Creative Lab</title>
          </head>
          <body>
            <p><a href="./en/">Creative Lab</a></p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
