name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Parity · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No registry-url / no npm cache — both have caused
      # "Exit handler never called!" on this repo's Actions runners.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm --version
          npm install -g npm@10.9.2
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Generate MDX source
        run: npx fumadocs-mdx

      - name: Dump npm log on failure
        if: failure()
        run: |
          ls -la "$HOME/.npm/_logs" || true
          tail -n 200 "$HOME/.npm/_logs/"*-debug-0.log || true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: FA parity
        run: npm run check:fa-parity

      # Full (non-static) production build — requires NEXT_PUBLIC_SITE_URL
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
