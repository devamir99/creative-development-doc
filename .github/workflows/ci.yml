name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Parity · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Avoid npm "Exit handler never called!" when postinstall runs inside ci.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Generate MDX source
        run: npx fumadocs-mdx

      - name: Dump npm log on failure
        if: failure()
        run: |
          ls -la "$HOME/.npm/_logs" || true
          tail -n 200 "$HOME/.npm/_logs/"*-debug-0.log || true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: FA parity
        run: npm run check:fa-parity

      # Full (non-static) production build — requires NEXT_PUBLIC_SITE_URL
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
